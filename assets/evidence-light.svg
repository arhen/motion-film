<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 556" width="1200" height="556" role="img" aria-label="Example evidence pack: seam, sync, loudness, onsets, beat grid, frames"><title>Example evidence pack: seam, sync, loudness, onsets, beat grid, frames</title><style></style><rect x="1.0" y="1.0" width="1198.0" height="554.0" rx="24" fill="#FBFAF7" stroke="#E6E1D8" stroke-width="2" opacity="1" /><text x="64.0" y="84.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="-0.6" opacity="1">Evidence, not “it rendered”</text><text x="64.0" y="122.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="0" opacity="1">Every check runs on the real output file. Values below were measured on real renders made with this process.</text><rect x="72.0" y="164.0" width="336.0" height="166.0" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1.5" opacity="1" /><circle cx="102.0" cy="198" r="11" fill="#0E9F8A"/><path d="M96.5 198.5 L100.5 202.5 L107.5 194" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="124.0" y="204.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="0" opacity="1">Loop seam</text><text x="124.0" y="226.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A8A298" text-anchor="start" letter-spacing="0" opacity="1">first vs last frame</text><text x="94.0" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="-1" opacity="1">44.7 dB</text><text x="94.0" y="310.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="0" opacity="1">pass at ≥ 40 dB PSNR</text><rect x="432.0" y="164.0" width="336.0" height="166.0" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1.5" opacity="1" /><circle cx="462.0" cy="198" r="11" fill="#0E9F8A"/><path d="M456.5 198.5 L460.5 202.5 L467.5 194" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="484.0" y="204.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="0" opacity="1">Word sync</text><text x="484.0" y="226.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A8A298" text-anchor="start" letter-spacing="0" opacity="1">speech-to-text of the mix</text><text x="454.0" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="-1" opacity="1">0.03 s</text><text x="454.0" y="310.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="0" opacity="1">median offset, 45/45 words heard</text><rect x="792.0" y="164.0" width="336.0" height="166.0" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1.5" opacity="1" /><circle cx="822.0" cy="198" r="11" fill="#0E9F8A"/><path d="M816.5 198.5 L820.5 202.5 L827.5 194" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="844.0" y="204.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="0" opacity="1">Loudness</text><text x="844.0" y="226.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A8A298" text-anchor="start" letter-spacing="0" opacity="1">integrated, from the MP4</text><text x="814.0" y="280.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="-1" opacity="1">-16.0 LUFS</text><text x="814.0" y="310.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="0" opacity="1">web loop target -16</text><rect x="72.0" y="354.0" width="336.0" height="166.0" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1.5" opacity="1" /><circle cx="102.0" cy="388" r="11" fill="#0E9F8A"/><path d="M96.5 388.5 L100.5 392.5 L107.5 384" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="124.0" y="394.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="0" opacity="1">True peak</text><text x="124.0" y="416.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A8A298" text-anchor="start" letter-spacing="0" opacity="1">after the AAC encode</text><text x="94.0" y="470.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="-1" opacity="1">-1.7 dB</text><text x="94.0" y="500.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="0" opacity="1">under the -1.5 dB ceiling</text><rect x="432.0" y="354.0" width="336.0" height="166.0" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1.5" opacity="1" /><circle cx="462.0" cy="388" r="11" fill="#0E9F8A"/><path d="M456.5 388.5 L460.5 392.5 L467.5 384" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="484.0" y="394.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="0" opacity="1">Cue onsets</text><text x="484.0" y="416.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A8A298" text-anchor="start" letter-spacing="0" opacity="1">SFX stem vs the clock</text><text x="454.0" y="470.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="-1" opacity="1">≤ 4 ms</text><text x="454.0" y="500.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="0" opacity="1">pass within one frame (33 ms)</text><rect x="792.0" y="354.0" width="336.0" height="166.0" rx="16" fill="#FFFFFF" stroke="#E6E1D8" stroke-width="1.5" opacity="1" /><circle cx="822.0" cy="388" r="11" fill="#0E9F8A"/><path d="M816.5 388.5 L820.5 392.5 L827.5 384" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><text x="844.0" y="394.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="0" opacity="1">Beat grid</text><text x="844.0" y="416.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#A8A298" text-anchor="start" letter-spacing="0" opacity="1">supplied track, re-read</text><text x="814.0" y="470.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="36" font-weight="700" fill="#16130F" text-anchor="start" letter-spacing="-1" opacity="1">128.02</text><text x="814.0" y="500.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#6B655C" text-anchor="start" letter-spacing="0" opacity="1">BPM after the mix (track: 128)</text></svg>
