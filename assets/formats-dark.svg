<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Landscape and vertical layouts with caption bands and safe zones"><title>Landscape and vertical layouts with caption bands and safe zones</title><style></style><rect x="1.0" y="1.0" width="1198.0" height="638.0" rx="24" fill="#0E0D0B" stroke="#2B2822" stroke-width="2" opacity="1" /><text x="64.0" y="84.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#F3EFE7" text-anchor="start" letter-spacing="-0.6" opacity="1">One story, one layout per format</text><text x="64.0" y="122.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#A49E93" text-anchor="start" letter-spacing="0" opacity="1">Never a crop. Type minimums come from the size the video is seen at; vertical keeps clear of the app's own interface.</text><rect x="64.0" y="168.0" width="600.0" height="338.0" rx="10" fill="#171511" stroke="#2B2822" stroke-width="2" opacity="1" /><rect x="104.0" y="214.0" width="150.0" height="228.0" rx="22" fill="#3A352D" stroke="none" stroke-width="1" opacity="1" /><rect x="114.0" y="228.0" width="130.0" height="200.0" rx="14" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.25" /><rect x="294.0" y="228.0" width="320.0" height="52.0" rx="12" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.14" /><rect x="294.0" y="294.0" width="320.0" height="52.0" rx="12" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.2" /><rect x="294.0" y="360.0" width="320.0" height="52.0" rx="12" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.26" /><rect x="214.0" y="462.7" width="300.0" height="40.0" rx="12" fill="#1B2040" stroke="#2B2822" stroke-width="1" opacity="1" /><text x="364.0" y="489.7" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F3EFE7" text-anchor="middle" letter-spacing="0" opacity="1">Captions are the voice-over</text><text x="64.0" y="540.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#F3EFE7" text-anchor="start" letter-spacing="0" opacity="1">16:9  1920 × 1080</text><text x="64.0" y="566.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A49E93" text-anchor="start" letter-spacing="0" opacity="1">Seen in a ~900 px card (× 0.47): captions ≥ 56 px, UI text ≥ 26 px.</text><rect x="700.0" y="160.0" width="225.0" height="400.0" rx="12" fill="#171511" stroke="#2B2822" stroke-width="2" opacity="1" /><rect x="722.0" y="242.0" width="80.0" height="80.0" rx="12" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.18" /><rect x="814.0" y="242.0" width="80.0" height="80.0" rx="12" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.22999999999999998" /><rect x="722.0" y="334.0" width="80.0" height="80.0" rx="12" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.22999999999999998" /><rect x="814.0" y="334.0" width="80.0" height="80.0" rx="12" fill="#7B93FF" stroke="none" stroke-width="1" opacity="0.28" /><rect x="722.0" y="218.0" width="140.0" height="14.0" rx="7" fill="#3A352D" stroke="none" stroke-width="1" opacity="1" /><rect x="738.2" y="422.0" width="148.5" height="34.0" rx="10" fill="#1B2040" stroke="#2B2822" stroke-width="1" opacity="1" /><text x="812.5" y="444.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#F3EFE7" text-anchor="middle" letter-spacing="0" opacity="1">Shorter chunks</text><rect x="700.0" y="160.0" width="225.0" height="46.0" rx="0" fill="#FF6B6F" stroke="none" stroke-width="1" opacity="0.16" /><rect x="895.8" y="300.0" width="29.2" height="160.0" rx="0" fill="#FF6B6F" stroke="none" stroke-width="1" opacity="0.16" /><rect x="700.0" y="460.0" width="225.0" height="100.0" rx="0" fill="#FF6B6F" stroke="none" stroke-width="1" opacity="0.16" /><rect x="700.0" y="160.0" width="225.0" height="400.0" rx="12" fill="none" stroke="#2B2822" stroke-width="2" opacity="1" /><line x1="931.0" y1="184.0" x2="953.0" y2="184.0" stroke="#FF6B6F" stroke-width="1.5" opacity="0.7"/><text x="961.0" y="190.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FF6B6F" text-anchor="start" letter-spacing="0" opacity="1">status bar, tabs</text><line x1="931.0" y1="380.0" x2="953.0" y2="380.0" stroke="#FF6B6F" stroke-width="1.5" opacity="0.7"/><text x="961.0" y="386.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FF6B6F" text-anchor="start" letter-spacing="0" opacity="1">like, comment, share</text><line x1="931.0" y1="512.0" x2="953.0" y2="512.0" stroke="#FF6B6F" stroke-width="1.5" opacity="0.7"/><text x="961.0" y="518.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#FF6B6F" text-anchor="start" letter-spacing="0" opacity="1">username, caption, music</text><text x="700.0" y="594.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#F3EFE7" text-anchor="start" letter-spacing="0" opacity="1">9:16  1080 × 1920</text><text x="700.0" y="620.0" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#A49E93" text-anchor="start" letter-spacing="0" opacity="1">Full width on a phone (× 0.36): captions ≥ 72 px.</text></svg>
